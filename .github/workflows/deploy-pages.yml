name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 若預設分支為 master，請改為 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # 直接發布根目錄下的靜態網頁檔案
